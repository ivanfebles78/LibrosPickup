<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puesto de atención · Recogida de libros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/empleado.css">
</head>
<body>
  <header class="wrap topbar">
    <div class="brand"><span class="brand-mark">L</span><span data-school>Colegio</span></div>
    <div class="row">
      <span class="conn" id="conn" title="Conexión en tiempo real"><i></i> conectando…</span>
      <div class="station-picker" id="station-picker" role="radiogroup" aria-label="Puesto"></div>
    </div>
  </header>

  <main class="wrap board">
    <section class="card now" aria-labelledby="now-title">
      <p class="eyebrow" id="now-title">Atendiendo ahora en <span id="now-station">puesto —</span></p>
      <div class="now-code" id="now-code">—</div>
      <p class="now-name" id="now-name">Nadie en atención. Pulsa «Siguiente» para llamar al primero de la cola.</p>
      <p class="now-meta muted" id="now-meta"></p>

      <div class="actions">
        <button class="btn btn-blue btn-lg" id="btn-next">
          <span id="btn-next-label">Siguiente</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button class="btn btn-ghost" id="btn-recall">Volver a llamar</button>
        <button class="btn btn-ghost" id="btn-done">Finalizado</button>
        <button class="btn btn-ghost danger" id="btn-noshow">No se presenta</button>
      </div>
      <div class="alert alert-error hidden" id="error" role="alert"></div>
    </section>

    <aside class="side">
      <section class="card queue" aria-labelledby="queue-title">
        <div class="queue-head">
          <h2 id="queue-title">Cola de turnos</h2>
          <span class="count" id="queue-count">0</span>
        </div>
        <ol class="queue-list" id="queue-list"></ol>
      </section>

      <section class="card others" aria-labelledby="others-title">
        <h2 id="others-title">Todos los puestos</h2>
        <ul class="others-list" id="others-list"></ul>
      </section>
    </aside>
  </main>

  <script type="module" src="/js/empleado.js"></script>
</body>
</html>
